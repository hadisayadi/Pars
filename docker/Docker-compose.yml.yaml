version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: pars-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Passw0rd
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P YourStrong@Passw0rd -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: pars-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__ParsDb=Server=sqlserver;Database=Pars;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
      - Jwt__Key=ThisIsASuperSecretKeyForParsDatabaseJwtTokenGeneration2026!
      - Jwt__Issuer=ParsSystem
      - Jwt__Audience=ParsSystemClients
    ports:
      - "7001:80"
    depends_on:
      sqlserver:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: pars-web
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ApiBaseUrl=http://api:80
    ports:
      - "7002:80"
    depends_on:
      - api

volumes:
  sqlserver-data: